<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students' Attendance System - Mark Attendance</title>
    <link rel="stylesheet" href="attendance.css">
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="history.back()">← Back</button>
        <h1>Mark Attendance</h1>
    </div>

    <div class="container">
        <div class="sidebar">
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li class="active"><a href="#">Mark Attendance</a></li>
            </ul>
        </div>

        <div class="main-content">
            <h2>Mark Today's Attendance</h2>
            
            <div class="filters">
                <label>Select Class:
                    <select id="classSelect">
                        <option>All Classes</option>
                        <option>BCA</option>
                        <option>BIT</option>
                        <option>BE</option>
                    </select>
                </label>
                <label>Select Date:
                    <input type="date" id="dateSelect">
                </label>
                <button onclick="loadStudents()">Load Students</button>
            </div>

            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <!-- Dynamic content -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadStudents() {
            // Placeholder
            alert('Load students');
        }
    </script>
</body>
</html>
