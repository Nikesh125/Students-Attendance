<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students' Attendance System - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="header">
        <h1>Attendance System</h1>
        <div class="header-right">
            <span>Welcome, Teacher</span>
            <a href="index.html" class="logout-link">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <ul class="nav-menu">
                <li class="active" onclick="setActive('dashboard')"><a href="#">Dashboard</a></li>
                <li onclick="setActive('attendance')"><a href="#">Mark Attendance</a></li>
            </ul>
        </div>

        <div class="main-content" id="dashboardContent" style="min-height: 600px;">
            <h2>Today's Attendance</h2>
            
            <div class="filters">
                <label>Select Class:
                    <select>
                        <option>All Classes</option>
                        <option>BCA</option>
                        <option>BIT</option>
                        <option>BE</option>
                    </select>
                </label>
                <label>Select Date:
                    <input type="date">
                </label>
                <button>Search</button>
                <button class="add-student-btn" onclick="openModal()">+ Add Student</button>
            </div>

            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px; color: #999;">No students added yet</td>
                    </tr>
                </tbody>
            </table>

            <div class="stats">
                <div class="stat-box">
                    <p>Total Students: <strong>-</strong></p>
                </div>
                <div class="stat-box">
                    <p>Present: <strong>-</strong></p>
                </div>
                <div class="stat-box">
                    <p>Absent: <strong>-</strong></p>
                </div>
                <div class="stat-box">
                    <p>Attendance Rate: <strong>-</strong></p>
                </div>
            </div>

            <button class="export-btn">Export Report</button>
        </div>

        <div class="main-content" id="attendanceContent" style="display: none; min-height: 600px;">
            <h2>Mark Today's Attendance</h2>
            
            <div class="filters">
                <label>Select Class:
                    <select id="classSelect">
                        <option>All Classes</option>
                        <option>BCA</option>
                        <option>BIT</option>
                        <option>BE</option>
                    </select>
                </label>
                <label>Select Date:
                    <input type="date" id="dateSelect">
                </label>
                <button onclick="loadStudentsAttendance()">Load Students</button>
            </div>

            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <!-- Dynamic content -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function setActive(section) {
            document.getElementById('dashboardContent').style.display = section === 'dashboard' ? 'block' : 'none';
            document.getElementById('attendanceContent').style.display = section === 'attendance' ? 'block' : 'none';
        }

        function openModal() {
            alert('Add Student modal would open here');
        }

        function loadStudentsAttendance() {
            // Placeholder for loading students
            alert('Load students for attendance');
        }
    </script>
</body>
</html>
