<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
        /* This hides the error message by default */
        #error-msg { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="text-center mb-4">Teacher Login</h2>
        
        <div id="error-msg" class="alert alert-danger py-2 text-center" role="alert">
            Invalid Username or Password!
        </div>

        <div id="success-msg" class="alert alert-success py-2 text-center" style="display:none;" role="alert">
            Registration Successful! Please login.
        </div>
        
        <form action="login" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">New teacher? <a href="register.jsp" class="text-decoration-none text-primary fw-bold">Register here</a></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // If the URL has ?error=1, show the RED error div
        if (urlParams.has('error')) {
            document.getElementById('error-msg').style.display = 'block';
            
            // Clean URL so message stays only until refresh
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        
        // If the URL has ?msg=success, show the GREEN success div
        if (urlParams.get('msg') === 'success') {
            document.getElementById('success-msg').style.display = 'block';
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>

</body>
</html>
